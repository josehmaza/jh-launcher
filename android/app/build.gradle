plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jh.launcher'
    compileSdk 33

    defaultConfig {
        applicationId "com.jh.launcher"
        minSdk 21
        targetSdk 28
        versionCode 13
        versionName "1.6.3"
    }

    buildFeatures {
        aidl true
    }

    buildTypes {
        release {
            minifyEnabled false
            // Misma clave que debug: se instala sobre la versión anterior sin desinstalar
            signingConfig signingConfigs.debug
        }
        debug {
            debuggable true
        }
    }

    lint {
        // Exigencia de Google Play; no aplica a una app instalada a mano en el radio
        disable 'ExpiredTargetSdkVersion'
    }

    // Las fuentes .ttf sin comprimir: no hay que descomprimirlas al arrancar
    aaptOptions {
        noCompress 'ttf'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "JH-LAUNCHER-v${variant.versionName}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.6.0'
}

// Las fotos del Tucson viven en jh-launcher/assets (las comparte la maqueta web de
// referencia). Se copian a una carpeta generada que entra al APK como assets/car/,
// así no hay copias duplicadas versionadas en git.
def generatedCarAssets = file("${buildDir}/generated/jh-assets")

android.sourceSets.main.assets.srcDirs += generatedCarAssets

tasks.register('syncCarImages', Sync) {
    from "${rootProject.projectDir.parentFile}/assets"
    into "${generatedCarAssets}/car"
    include '*.jpg'
}

tasks.named('preBuild').configure {
    dependsOn 'syncCarImages'
}

// Al terminar assembleRelease, copia el APK a la raíz de jh-launcher/
tasks.register('copyApkToRoot') {
    doLast {
        def repoRoot = rootProject.projectDir.parentFile
        project.delete(fileTree(repoRoot) { include 'JH-LAUNCHER-v*.apk' })
        project.copy {
            from layout.buildDirectory.dir('outputs/apk/release')
            into repoRoot
            include '*.apk'
        }
    }
}

afterEvaluate {
    tasks.named('assembleRelease').configure { finalizedBy 'copyApkToRoot' }
}
